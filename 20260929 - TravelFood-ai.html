<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData - 農村地方美食</title>

    <link rel="stylesheet" href="css/TFood.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-page-bg);
            font-family: var(--font-family-base);
            color: var(--color-text);
        }

        .wrapper {
            background-color: var(--color-content-bg);
            width: 1024px;
            margin-top: 20px;
            margin-bottom: 20px;
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 50px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--color-shadow);
            /* 使用變數陰影 */
        }

        .banner {
            background-color: var(--color-banner-bg);
            /* 使用變數設定卡片底色 */
            border: 1px solid var(--color-banner-border);
            /* 使用變數設定邊框 */
            width: 30%;
            display: inline-block;
            vertical-align: top;
            padding: 1%;
            box-shadow: 3px 3px 6px var(--color-shadow);
            margin-top: 10px;
            margin-right: 2%;
            margin-bottom: 20px;
            border-radius: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .banner:hover {
            transform: translateY(-3px);
            box-shadow: 5px 5px 12px var(--color-hover-shadow);
            /* 懸停時帶有淡淡的咖綠光暈 */
        }

        .banner p {
            font-family: var(--font-family-base);
            font-size: 14px;
            color: var(--color-text);
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .banner p:first-of-type {
            font-weight: 700;
            color: var(--color-heading);
            /* 店名用主標題色 */
            font-size: 16px;
        }

        .logo {
            background-color: var(--color-logo-bg);
            /* 使用變數設定 Logo 佔位區背景色 */
            display: block;
            width: 100%;
            height: 200px;
            margin-bottom: 12px;
            border-radius: 4px;            
            background-position: center center;
            background-size: cover;
        }

        /* 網頁標題樣式 */
        .page-header-title {
            font-family: var(--font-family-title);
            font-size: 32px;
            font-weight: 700;
            color: var(--color-page-title);
            /* 改用綠色大標題變數 */
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        @media screen and (max-width: 1024px) {
            .wrapper {
                width: 100%;
                padding: 10px;
            }

            .banner {
                width: 47%;
                /* 平板雙欄 */
                margin-right: 2%;
            }
        }

        @media screen and (max-width: 600px) {
            .banner {
                width: 100%;
                /* 手機單欄 */
                margin-right: 0;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper" id="foodlist">
        <h1 class="page-header-title">🌾 在地農村小吃特搜</h1>
        <!-- 动态生成的 banner 卡片會接在下方 -->
    </div>

    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/TravelFood.js"></script>

    <script>
        console.log(food);

        food.forEach(function (item) {
            $("#foodlist").append('<div class="banner"><div class="logo"  style="background-image: url(' + item.PicURL + ');"></div><p>店名: ' + item.Name + '</p><p>地址: ' + item.Address + '</p><p>電話: ' + item.Tel + '</p></div>');
        });
    </script>
</body>

</html>
